# Harness for rutabaga_gfx's C ABI (rutabaga_gfx/ffi/src/lib.rs): fuzz target + known-answer tests.
# The ffi crate is cdylib/staticlib only (no rlib) and is its own workspace, so its source file is
# compiled in here as a module (src/lib.rs); nothing upstream is edited or copied.
[package]
name = "rutabaga_ffi"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

# Its own workspace root: crosvm's root [workspace] lists its members explicitly.
[workspace]

[lib]
path = "src/lib.rs"
test = false
doctest = false

[profile.release]
panic = 'abort'
opt-level = 3
overflow-checks = true

[dependencies]
rutabaga_gfx = { path = "../../rutabaga_gfx" }
libc = "0.2"
log = "0.4"
once_cell = "1.7"

[target.'cfg(fuzzing)'.dependencies]
libfuzzer-sys = "=0.4.4"

[[bin]]
name = "rutabaga_ffi_fuzzer"
path = "fuzz_targets/rutabaga_ffi_fuzzer.rs"
test = false
doc = false
